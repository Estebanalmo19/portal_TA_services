<header class="topbar">
  <button type="button" class="mobile-nav-toggle" data-mobile-nav-toggle aria-label="Abrir menú" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  <div class="topbar-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <label class="visually-hidden" for="global-search-input">Búsqueda global</label>
    <input id="global-search-input" type="search" placeholder="Buscar soluciones, referidos, tickets…" data-global-search autocomplete="off">
    <div class="topbar-search-results" data-global-search-results hidden role="listbox"></div>
  </div>

  <span class="demo-badge">{{ DEMO_LABEL }}</span>

  <div class="topbar-actions">
    <button type="button" class="icon-button" data-theme-toggle aria-pressed="false" data-tooltip="Cambiar tema claro/oscuro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>

    <div class="cluster" style="position:relative;">
      <button type="button" class="icon-button" data-notifications-toggle aria-haspopup="true" aria-expanded="false" data-tooltip="Notificaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span class="badge-dot" data-notifications-dot hidden></span>
      </button>
      <div class="topbar-search-results" data-notifications-panel hidden style="width:340px; right:0; left:auto;"></div>
    </div>

    <div class="cluster" style="position:relative;">
      <button type="button" class="icon-button" data-profile-toggle aria-haspopup="true" aria-expanded="false" data-tooltip="Perfil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 6-5 8-5s6.5 1 8 5"/></svg>
      </button>
      <div class="topbar-search-results" data-profile-panel hidden style="width:260px; right:0; left:auto; padding: var(--space-3);">
        <p class="text-secondary" style="margin:0 0 var(--space-2); font-size: var(--font-size-sm);" data-profile-label>Perfil: —</p>
        <a class="btn btn-secondary btn-sm" style="width:100%; margin-bottom: var(--space-2);" href="{% url 'core:welcome' %}">Cambiar perfil</a>
        <button type="button" class="btn btn-danger btn-sm" style="width:100%;" data-reset-demo>Restablecer demo</button>
      </div>
    </div>
  </div>
</header>
