{% load static %}
<nav class="sidebar" aria-label="Navegación principal">
  <a class="sidebar-brand" href="{% url 'core:catalog' %}">
    <span class="sidebar-brand-mark" aria-hidden="true">A</span>
    <span class="sidebar-brand-label">ARRISE Solutions</span>
  </a>

  <button type="button" class="sidebar-toggle" data-sidebar-toggle aria-pressed="false" aria-label="Colapsar barra lateral">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  <div class="sidebar-nav">
    <a class="nav-item{% if request.path == '/catalogo/' %} is-active{% endif %}" href="{% url 'core:catalog' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span class="nav-label">Catálogo</span>
    </a>
    <a class="nav-item{% if '/dashboard/' in request.path %} is-active{% endif %}" href="{% url 'dashboard:home' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      <span class="nav-label">Dashboard ejecutivo</span>
    </a>

    <div class="sidebar-section-title">Soluciones</div>
    {% for solution in NAV_SOLUTIONS %}
      <a class="nav-item{% if '/soluciones/'|add:solution.slug in request.path %} is-active{% endif %}" href="/soluciones/{{ solution.slug }}/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
        <span class="nav-label">{{ solution.name }}</span>
      </a>
    {% endfor %}

    <div class="sidebar-section-title">Asistente</div>
    <button type="button" class="nav-item" data-agent-ta-open style="width:100%; text-align:left; border:none; background:none; cursor:pointer;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span class="nav-label">Agent TA</span>
    </button>

    <div class="sidebar-section-title">Portal</div>
    <a class="nav-item{% if request.path == '/acerca/' %} is-active{% endif %}" href="{% url 'core:about' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span class="nav-label">Acerca de</span>
    </a>
  </div>
</nav>
